<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Nhân Viên Mới</title>
    
    <!-- Nhúng thư viện Bootstrap 5 và FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- CSS tùy chỉnh làm đẹp giao diện -->
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card-custom { 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        .btn-custom { 
            border-radius: 8px; 
            font-weight: 600; 
            padding: 12px; 
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card card-custom p-4 bg-white" style="width: 100%; max-width: 450px;">
        <h3 class="text-center text-success mb-4 fw-bold">
            <i class="fas fa-user-plus me-2"></i>THÊM MỚI
        </h3>
        
        <!-- Ô nhập Mã nhân viên (dùng Floating label) -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="m" placeholder="Mã nhân viên">
            <label for="m" class="text-secondary"><i class="fas fa-id-badge me-2"></i>Mã nhân viên</label>
        </div>
        
        <!-- Ô nhập Họ và tên -->
        <div class="form-floating mb-4">
            <input type="text" class="form-control" id="t" placeholder="Họ và tên">
            <label for="t" class="text-secondary"><i class="fas fa-user me-2"></i>Họ và tên</label>
        </div>
        
        <!-- Nút Lưu -->
        <button class="btn btn-success btn-custom w-100 mb-3" onclick="save()">
            <i class="fas fa-save me-2"></i>Lưu nhân viên
        </button>
        
        <!-- Nút Quay lại -->
        <a href="index.html" class="text-center d-block text-decoration-none text-secondary custom-link">
            <i class="fas fa-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <script>
        function save() {
            const data = { 
                manv: document.getElementById('m').value.trim(), 
                hoten: document.getElementById('t').value.trim() 
            };
            
            // Báo lỗi nếu người dùng để trống
            if(!data.manv || !data.hoten) {
                alert("Vui lòng nhập đầy đủ Mã nhân viên và Họ tên!");
                return;
            }

            fetch('/api/nhanvien', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(r => {
                if(r.ok) {
                    location.href = "index.html";
                } else {
                    alert("Lỗi! Có thể mã nhân viên đã tồn tại.");
                }
            });
        }
    </script>
</body>
</html>
