<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Nhân Viên</title>
    
    <!-- Nhúng thư viện Bootstrap 5 và FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- CSS tùy chỉnh làm đẹp giao diện -->
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card-custom { 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border-top: 6px solid #ffc107 !important; /* Viền vàng phía trên */
        }
        .btn-custom { 
            border-radius: 8px; 
            font-weight: 600; 
            padding: 12px; 
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
        .input-readonly { 
            background-color: #e9ecef !important; 
            color: #6c757d;
            cursor: not-allowed; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card card-custom p-4 bg-white" style="width: 100%; max-width: 450px;">
        <h3 class="text-center text-warning mb-4 fw-bold">
            <i class="fas fa-user-edit me-2"></i>CẬP NHẬT
        </h3>
        
        <!-- Ô hiển thị Mã nhân viên (Chỉ đọc) -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control input-readonly" id="m" readonly placeholder="Mã nhân viên">
            <label for="m" class="text-secondary"><i class="fas fa-id-card me-2"></i>Mã nhân viên (Không thể sửa)</label>
        </div>
        
        <!-- Ô nhập Họ tên mới -->
        <div class="form-floating mb-4">
            <input type="text" class="form-control border-warning" id="t" placeholder="Họ tên mới">
            <label for="t" class="text-secondary"><i class="fas fa-user me-2"></i>Họ tên mới</label>
        </div>
        
        <!-- Nút Cập nhật -->
        <button class="btn btn-warning text-dark btn-custom w-100 mb-3" onclick="update()">
            <i class="fas fa-check-circle me-2"></i>Cập nhật ngay
        </button>
        
        <!-- Nút Quay lại -->
        <a href="index.html" class="text-center d-block text-decoration-none text-secondary">
            <i class="fas fa-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <script>
        // Lấy dữ liệu cũ từ thanh URL (do trang index.html truyền qua)
        const p = new URLSearchParams(window.location.search);
        document.getElementById('m').value = p.get('ma') || '';
        document.getElementById('t').value = p.get('ten') || '';

        function update() {
            const data = { 
                manv: document.getElementById('m').value, 
                hoten: document.getElementById('t').value.trim() 
            };

            // Kiểm tra không cho để trống tên
            if(!data.hoten) {
                alert("Vui lòng nhập họ tên mới!");
                return;
            }

            fetch('/api/nhanvien', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(r => {
                if(r.ok) {
                    location.href = "index.html";
                } else {
                    alert("Lỗi hệ thống! Không thể cập nhật.");
                }
            });
        }
    </script>
</body>
</html>
